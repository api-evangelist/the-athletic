description: >-
  The Athletic is a subscription-based digital sports media company founded in
  2016 by Alex Mather and Adam Hansmann, offering in-depth, ad-light coverage of
  national and local professional and college sports through a large staff of
  beat writers and columnists. Acquired by The New York Times Company in 2022,
  The Athletic delivers written articles, newsletters, podcasts, and live
  coverage across its website and mobile apps. As of this enrichment pass The
  Athletic does not publish a public developer API, developer portal, SDKs, or
  machine-readable API specifications; its GitHub organization contains only
  forks of open-source engineering tooling rather than any public API product.
